# DB resmi aplikasi = SQLite (file di api/prisma/dev.db) untuk deployment single-site.
# Compose ini hanya menyediakan Redis (dipakai aplikasi via api/src/config/redis.js).
# Postgres/pgAdmin sengaja tidak disertakan; lihat docs/rencana_perbaikan.md & prisma/MIGRATION_ALIGNMENT.md.
services:
  redis:
    image: redis:7-alpine
    container_name: dxk_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes

volumes:
  redis_data:
