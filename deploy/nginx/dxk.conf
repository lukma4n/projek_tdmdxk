# ============================================================
# Nginx reverse proxy untuk DXK Operation System
# Node (PM2) menyajikan frontend (web/dist) + API di 127.0.0.1:3001.
# Nginx hanya meneruskan + terminasi TLS.
#
# Pasang:
#   sudo cp deploy/nginx/dxk.conf /etc/nginx/sites-available/dxk.conf
#   sudo ln -s /etc/nginx/sites-available/dxk.conf /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#
# GANTI app.domain-anda.com dengan domain asli SEBELUM menjalankan certbot.
# Blok HTTPS (listen 443) akan DITAMBAHKAN OTOMATIS oleh `sudo certbot --nginx`.
# ============================================================

server {
    listen 80;
    listen [::]:80;
    server_name app.domain-anda.com;

    # Batas ukuran body: import Excel s/d 50MB (multer) + overhead.
    # KTP 10MB sudah tercakup. Naikkan bila ada import lebih besar.
    client_max_body_size 55M;

    # Upload/import besar butuh waktu — longgarkan timeout proxy.
    proxy_connect_timeout 60s;
    proxy_send_timeout    300s;
    proxy_read_timeout    300s;

    location / {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;

        # WAJIB: app pakai `trust proxy` + isSecureCookie() membaca header ini.
        # Tanpa X-Forwarded-Proto, cookie `token` tidak akan ber-flag Secure.
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
